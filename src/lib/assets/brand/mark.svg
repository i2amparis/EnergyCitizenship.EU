<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 60 60" fill="none" stroke="#1d2b29" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
	<!-- EnergyCitizenship.eu mark: a citizen's home that also produces energy,
	     drawn in the style of the platform's expression illustrations -->
	<!-- sun -->
	<g stroke-width="2.2">
		<path d="M49 4.5v3M58.5 14h-3M55.7 7.3l-2.1 2.1M42.3 7.3l2.1 2.1"/>
	</g>
	<circle cx="49" cy="14.5" r="5.6" fill="#f9c623"/>
	<!-- chimney -->
	<path d="M38 22.5V15.5h5v11.2" fill="#c9d3d6"/>
	<!-- gable + walls -->
	<path d="M13 33 28 20 43 33v20.5H13z" fill="#fde2a6" stroke="none"/>
	<path d="M13 30.5v23h30v-23" fill="none"/>
	<!-- roof (chevron band) -->
	<path d="M6.5 32.5 28 14l21.5 18.5-3.4 3.9L28 20.8 9.9 36.4z" fill="#e85d4f"/>
	<!-- window -->
	<rect x="17.5" y="35.5" width="11" height="10" rx="1.2" fill="#7ccbf0"/>
	<path d="M23 35.5v10M17.5 40.5h11" stroke-width="2"/>
	<!-- door -->
	<path d="M33 53.5v-13a1.2 1.2 0 0 1 1.2-1.2h3.6a1.2 1.2 0 0 1 1.2 1.2v13" fill="#e85d4f"/>
	<!-- sprout -->
	<path d="M52.5 53.5V41"/>
	<path d="M52.5 46.5c-.8-5-4.4-7.4-7.6-6.8-.4 4.4 3 7.2 7.6 6.8z" fill="#8cc152"/>
	<path d="M52.5 42c.4-5.4 4.2-8.2 7.6-7.6.6 4.6-3 7.8-7.6 7.6z" fill="#8cc152"/>
	<!-- ground -->
	<path d="M4.5 53.5h55"/>
</svg>
